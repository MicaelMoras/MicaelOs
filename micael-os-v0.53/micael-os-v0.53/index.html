/* Campos numéricos: controles compatíveis com o tema escuro */
.field input[type="number"]{color-scheme:dark;background:#111319;color:var(--text);}
.field input[type="number"]::-webkit-inner-spin-button,.field input[type="number"]::-webkit-outer-spin-button{opacity:1;filter:invert(.82);background:transparent;margin:0;}
.field input[type="number"]{appearance:auto;-moz-appearance:auto;}

/* Ajuste do formulário financeiro: a área de categoria personalizada não deve esticar o campo de data. */
#transactionForm .form-grid{align-items:start}
#transactionForm .field{align-content:start;align-self:start;min-width:0}
#transactionForm #transactionDate{height:42px;min-height:42px;align-self:start;box-sizing:border-box;color-scheme:dark;padding:10px 12px}
#transactionForm #customCategoryWrap{margin-top:8px!important}
#transactionForm #customCategoryHint{display:block;line-height:1.4;margin-top:2px}


/* Rotina: campos compactos e alinhados, inclusive ao exibir categoria personalizada. */
#habitForm .form-grid{align-items:start}
#habitForm .field{align-content:start;align-self:start;min-width:0}
#habitForm .field input,#habitForm .field select{height:42px;min-height:42px;box-sizing:border-box}
#habitForm #habitCustomCategoryWrap{margin-top:8px!important}
#habitForm #habitCustomCategory{height:42px;min-height:42px}

/* Estudos: frequência e tempo planejado com a mesma altura e alinhamento. */
#subjectForm .form-grid{align-items:start}
#subjectForm .field{align-content:start;align-self:start;min-width:0;gap:6px}
#subjectForm .field label{display:block;min-height:14px;line-height:14px;margin:0}
#subjectForm .field input:not([type="hidden"]),#subjectForm .field select{height:42px;min-height:42px;box-sizing:border-box;padding:0 12px;line-height:normal}
#subjectForm .field input[type="number"]{appearance:textfield;-moz-appearance:textfield}
#subjectForm .field input[type="number"]::-webkit-inner-spin-button,#subjectForm .field input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}



/* Rotina: apresentação minimalista em tema escuro, somente nome e checkbox. */
.habit-simple-list{display:grid;gap:0}
.habit-row-simple{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px;padding:8px 2px;border-bottom:1px solid var(--line)}
.habit-row-simple:last-child{border-bottom:0}
.habit-row-name{font-size:13px;font-weight:700;color:var(--text);flex:1;min-width:0}
.habit-row-check{width:22px;height:22px;min-width:22px;padding:0;border:1px solid #596171;border-radius:5px;background:transparent;color:#11131a;font-size:14px;font-weight:900;display:grid;place-items:center;cursor:pointer}
.habit-row-check:hover{border-color:var(--accent);background:#292331}
.habit-row-check.done{background:var(--green);border-color:var(--green);color:#101318}


/* Pomodoro espacial com temporizador central e painel de estatísticas. */
.pomodoro-page{max-width:1200px;margin:0 auto}
.pomodoro-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pomodoro-toolbar-caption{font-size:11px;font-weight:850;letter-spacing:1.5px;color:#a9a6be}
.pomodoro-toolbar-caption span{color:#716a8b;padding:0 5px}
.pom-analytics-button{border:1px solid #454357;background:#191927;color:#eceaf5;border-radius:11px;padding:10px 15px;font-size:12px;font-weight:750}
.pom-analytics-button:hover{background:#28263a;border-color:#76699c}
.pomodoro-scene{position:relative;isolation:isolate;overflow:hidden;min-height:610px;padding:30px 28px 26px;border-radius:25px;border:1px solid #49435e;background:radial-gradient(ellipse at 15% 72%,rgba(157,112,145,.55),transparent 36%),radial-gradient(ellipse at 75% 24%,rgba(62,74,117,.65),transparent 34%),radial-gradient(ellipse at 55% 96%,rgba(184,146,112,.24),transparent 42%),linear-gradient(160deg,#0b0d1d 0%,#17152b 48%,#080a15 100%);display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 25px 80px #05051055}
.pomodoro-scene:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.72;background-image:radial-gradient(1px 1px at 7% 16%,#fff 45%,transparent 60%),radial-gradient(1px 1px at 14% 54%,#fff 45%,transparent 60%),radial-gradient(2px 2px at 25% 23%,#fff 45%,transparent 60%),radial-gradient(1px 1px at 34% 66%,#fff 45%,transparent 60%),radial-gradient(1px 1px at 47% 12%,#fff 45%,transparent 60%),radial-gradient(2px 2px at 58% 38%,#fff 45%,transparent 60%),radial-gradient(1px 1px at 70% 15%,#fff 45%,transparent 60%),radial-gradient(1px 1px at 81% 62%,#fff 45%,transparent 60%),radial-gradient(2px 2px at 93% 27%,#fff 45%,transparent 60%),radial-gradient(1px 1px at 88% 83%,#fff 45%,transparent 60%),radial-gradient(1px 1px at 40% 88%,#fff 45%,transparent 60%)}
.pom-scene-orb{position:absolute;z-index:-1;border-radius:50%;pointer-events:none;filter:blur(.2px)}
.pom-scene-orb.orb-one{width:115px;height:115px;top:125px;left:50%;transform:translateX(-50%);background:linear-gradient(115deg,#d2b18c 0 12%,#685b82 28%,#2c2b4d 80%);box-shadow:0 0 55px #8d75a466}
.pom-scene-orb.orb-two{width:34px;height:34px;top:72px;left:12%;background:linear-gradient(135deg,#c49a92,#614b6f);box-shadow:0 0 25px #d1a0a066}
.pom-cycle-pill{display:flex;align-items:center;gap:5px;padding:8px 15px;border-radius:30px;background:#080910aa;border:1px solid #ffffff22;color:#dcd9e9;font-size:11px;letter-spacing:.6px;z-index:1}
.pom-tomato{font-size:17px;filter:grayscale(1);opacity:.35}
.pom-tomato.on{filter:none;opacity:1}
.pom-cycle-divider{height:18px;width:1px;background:#ffffff26;margin:0 8px}
.pom-cycle-pill b{font-weight:750;white-space:nowrap}
.pom-mode-tabs{display:flex;gap:4px;margin-top:23px;padding:5px;border-radius:14px;background:#090a13bb;border:1px solid #ffffff12;z-index:1}
.pom-mode-tabs button{border:0;background:transparent;color:#c2bfd0;padding:12px 25px;border-radius:10px;font-size:14px;font-weight:750}
.pom-mode-tabs button.active{background:#fff;color:#171724;box-shadow:0 2px 12px #0004}
.pom-timer-caption{margin-top:34px;color:#d0c9e2;font-size:11px;font-weight:750;letter-spacing:2px;text-transform:uppercase}
.pomodoro-time{font-size:clamp(86px,15vw,156px);line-height:1.05;font-weight:850;letter-spacing:-8px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 8px 45px #0a071c99;margin:2px 0 8px;z-index:1}
.pom-presets{display:flex;align-items:center;justify-content:center;gap:8px;margin:7px 0 18px;color:#c0bbd0;font-size:11px}
.pom-presets button{border:1px solid #ffffff2b;background:#ffffff0d;color:#e7e4ef;border-radius:8px;padding:6px 10px;font-size:11px}
.pom-presets button.selected{background:#ffffff;color:#1a1924;border-color:#fff;font-weight:800}
.pom-presets span{margin-right:3px}
.pomodoro-controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px;z-index:1}
.pom-start,.pom-reset{min-width:125px;height:54px;padding:0 25px;border-radius:12px;border:1px solid #ffffff25;font-size:17px;font-weight:800}
.pom-start{background:#fff;color:#191927}
.pom-reset{background:#ffffff1b;color:#fff}
.pom-popout{border:0;background:transparent;color:#d0ccdc;padding:12px 10px;font-size:11px;font-weight:700}
.pomodoro-session-meta{display:grid;grid-template-columns:minmax(180px,230px) minmax(220px,330px);gap:12px;width:min(590px,100%);margin-top:27px;text-align:left;z-index:1}
.pomodoro-session-meta .field label{color:#c4bfd1}
.pomodoro-session-meta .field input,.pomodoro-session-meta .field select{background:#0d0f1bd9;border-color:#ffffff26;color:#fff}
.pom-analytics{display:grid;gap:16px}
.pom-analytics-header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.pom-analytics-header h2{font-size:25px;margin:3px 0}
.pom-analytics-header p{font-size:12px;color:var(--muted);margin:0}
.pom-eyebrow{font-size:10px;letter-spacing:1.5px;color:#a99bd4;font-weight:850}
.pom-analytics-actions{display:flex;gap:8px;flex-wrap:wrap}
.pom-xp{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;padding:14px;border:1px solid #33384a;background:#171c2a;border-radius:17px}
.pom-level{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:#211e34}
.pom-level-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#393351;color:#f8cb67;font-size:20px}
.pom-level b,.pom-level small{display:block}.pom-level b{font-size:13px}.pom-level small{font-size:10px;color:var(--muted);margin-top:3px}
.pom-xp-track{align-self:center}
.pom-xp-label{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#a6aabb;margin-bottom:8px}
.pom-xp-label strong{color:#f2f2f7}
.pom-xp-bar{height:11px;border-radius:30px;background:#303446;overflow:hidden}
.pom-xp-bar i{display:block;height:100%;border-radius:30px;background:linear-gradient(90deg,#ff664c,#f88f5d)}
.pom-xp-track>small{display:block;font-size:10px;color:#9298aa;margin-top:6px}
.pom-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pom-stat-card,.pom-analytics-card{border:1px solid #333949;background:#171d2b;border-radius:16px;padding:16px;min-width:0}
.pom-stat-label{display:flex;align-items:center;justify-content:space-between;color:#9da4b6;font-size:10px;font-weight:850;letter-spacing:.7px}
.pom-stat-label span{font-size:17px}
.pom-stat-card>strong{display:block;color:#f4f5fa;font-size:31px;line-height:1.2;margin:12px 0 7px;font-weight:850}
.pom-stat-card>small,.pom-analytics-card small{display:block;color:#9199aa;font-size:11px;line-height:1.45}
.pom-analytics-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.pom-analytics-card-head b{display:block;font-size:14px}
.pom-analytics-card-head small{margin-top:3px}
.pom-legend{display:flex;align-items:center;gap:5px;color:#9097a7;font-size:9px;white-space:nowrap}
.pom-legend i,.pom-heat-cell{width:12px;height:12px;border-radius:3px;background:#242b3a;display:block}
.pom-calendar-wrap{position:relative;padding-left:27px}
.pom-calendar-scroll{max-width:100%;overflow-x:auto;scrollbar-width:thin}
.pom-calendar-track{width:max-content}
.pom-month-labels{display:grid;column-gap:4px;align-items:end;color:#9298aa;font-size:9px;margin:0 2px 6px;width:max-content;min-height:12px}
.pom-month-labels span{white-space:nowrap;overflow:visible}
.pom-month-labels span.current{color:#d6c9ff;font-weight:850}
.pom-heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:4px;padding:3px 2px 7px;width:max-content}
.pom-weekdays{position:absolute;left:0;top:23px;display:flex;flex-direction:column;justify-content:space-between;height:108px;font-size:8px;color:#81899c}
.pom-heat-cell.level-0{background:#242b3a}.pom-heat-cell.level-1{background:#075a49}.pom-heat-cell.level-2{background:#087a5d}.pom-heat-cell.level-3{background:#10a47b}.pom-heat-cell.level-4{background:#39d5a4}
.pom-analytics-lower{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(250px,.9fr);gap:12px}
.pom-total-period{font-size:18px;font-weight:850;white-space:nowrap}
.pom-total-period em{font-size:10px;font-style:normal;margin-left:5px}
.pom-total-period em.up{color:#52d2a7}.pom-total-period em.down{color:#f08d9a}.pom-total-period em.flat{color:#9da4b6}
.pom-14-bars{display:flex;align-items:flex-end;gap:7px;height:142px;padding:12px 3px 0;border-bottom:1px solid #343c4c}
.pom-day-bar{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
.pom-day-bar-fill{width:min(100%,22px);min-height:2px;border-radius:5px 5px 2px 2px;background:#13a57e}
.pom-day-bar small{font-size:9px;color:#8f97a8}
.pom-side-stats{display:grid;gap:12px}
.pom-side-stats .pom-analytics-card>strong{display:block;font-size:22px;margin:8px 0}
.pom-member-since{border:1px solid #333949;background:#171d2b;padding:12px 15px;border-radius:12px;font-size:11px;color:#a0a7b7}
.pom-member-since b{color:#f3f4f9}
.pom-data-note{font-size:10px;color:#7f8798;margin:0}
@media(max-width:850px){.pom-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pom-analytics-lower{grid-template-columns:1fr}}
@media(max-width:620px){.pomodoro-scene{padding:22px 14px;min-height:570px}.pom-mode-tabs button{padding:10px 12px;font-size:11px}.pomodoro-time{font-size:clamp(70px,19vw,112px);letter-spacing:-5px}.pomodoro-session-meta{grid-template-columns:1fr}.pom-xp{grid-template-columns:1fr}.pom-analytics-header{align-items:flex-start;flex-direction:column}.pom-stat-grid{grid-template-columns:1fr}.pom-analytics-actions{width:100%}}


/* Pomodoro clean layout: no scenic image, orbit, or circular progress. */
.pomodoro-toolbar-actions{display:flex;align-items:center;gap:8px}
.pom-gear-button{width:39px;height:39px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);font-size:18px;display:grid;place-items:center}
.pom-gear-button:hover{border-color:var(--accent);background:#292331}
.pomodoro-clean{min-height:520px;padding:30px 18px 36px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:transparent;border:0;box-shadow:none;position:relative;overflow:visible}
.pom-clean-cycle{display:flex;align-items:center;justify-content:center;gap:5px;min-height:28px;color:var(--muted);font-size:11px}
.pom-clean-cycle .pom-tomato{font-size:15px}
.pom-clean-cycle>span:last-child{margin-left:8px}
.pom-mode-tabs{margin-top:24px}
.pom-clean-mode{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:750;margin-top:32px}.pom-clean-subject{margin-top:9px;padding:7px 12px;border:1px solid #454052;background:#1b1927aa;border-radius:99px;color:#cfc5ea;font-size:11px;max-width:min(90%,440px);overflow-wrap:anywhere}.pom-clean-subject.empty{border-color:var(--line);background:#15171d99;color:var(--muted);padding:0;border:0}
.pomodoro-time{font-size:clamp(84px,13vw,142px);font-weight:850;letter-spacing:-6px;line-height:1.06;margin:6px 0 24px;color:var(--text);text-shadow:none;font-variant-numeric:tabular-nums}
.pomodoro-controls{margin-top:0;gap:10px}
.pom-start,.pom-reset{min-width:118px;height:48px;border-radius:10px;font-size:14px}
.pom-start{background:var(--accent);border-color:var(--accent);color:#171322}
.pom-reset{background:var(--panel2);color:var(--text);border-color:var(--line)}
.pom-popout{color:var(--muted);padding:10px}
@media(max-width:620px){.pomodoro-clean{min-height:460px;padding:22px 5px}.pomodoro-time{font-size:clamp(70px,18vw,108px);letter-spacing:-4px}.pom-mode-tabs button{padding:10px 12px;font-size:11px}.pomodoro-controls{gap:7px}.pom-start,.pom-reset{min-width:100px}}


/* Notes workspace — notebook / page layout */
.notes-head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notes-workspace{display:grid;grid-template-columns:220px minmax(245px,290px) minmax(0,1fr);min-height:690px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#15171d;box-shadow:0 18px 50px #0002}
.notes-rail{background:#171920;border-right:1px solid var(--line);padding:18px 13px;min-width:0}
.notes-rail-head,.notes-pages-head,.notes-editor-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.notes-rail-title{font-size:12px;font-weight:800;letter-spacing:.2px}
.notes-rail-label{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:1.3px;text-transform:uppercase;margin:22px 8px 8px}
.notes-folder-list{display:grid;gap:4px;margin-top:12px}
.notes-folder-item{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;color:var(--soft);border-radius:10px;padding:9px 8px;text-align:left;min-width:0;width:100%;font-size:11px}
.notes-folder-item:hover{background:var(--panel2)}
.notes-folder-item.active{background:#302942;border-color:#51416d;color:#e0d7ff}
.notes-folder-item.trash-item{margin-top:10px;padding-top:13px;border-top:1px solid var(--line);border-radius:0}
.notes-folder-item.trash-item.active{border-radius:9px;background:#302942;border-top-color:var(--line)}
.notes-folder-item .folder-label{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes-folder-item .folder-count{font-size:9px;color:var(--muted)}
.notes-folder-item .folder-edit{opacity:.6;border:0;background:transparent;color:inherit;padding:2px 4px;border-radius:5px}
.notes-folder-item .folder-edit:hover{opacity:1;background:#ffffff12}
.notes-rail-footer{border-top:1px solid var(--line);margin-top:22px;padding-top:14px;display:grid;gap:7px}
.notes-middle{min-width:0;border-right:1px solid var(--line);background:#191b22;display:flex;flex-direction:column}
.notes-pages-head{padding:17px 15px 12px}
.notes-pages-title{font-size:13px;font-weight:800}
.notes-search{padding:0 13px 12px}
.notes-search input{width:100%;height:36px;background:#111319;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:0 11px;font-size:11px;outline:none}
.notes-list{display:grid;gap:5px;padding:0 8px 14px;overflow:auto;max-height:590px}
.notes-page-item{padding:12px 11px;border:1px solid transparent;border-radius:11px;background:transparent;text-align:left;color:var(--text);cursor:pointer;display:block;width:100%;min-width:0}
.notes-page-item:hover{background:#22252e}
.notes-page-item.active{background:#302942;border-color:#594a75}
.notes-page-item strong{display:block;font-size:11px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notes-page-item p{font-size:10px;color:var(--muted);line-height:1.5;margin:6px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.notes-page-item small{font-size:9px;color:#777e8c}
.notes-page-empty{padding:24px 14px;color:var(--muted);font-size:11px;line-height:1.6;text-align:center}
.notes-editor{min-width:0;padding:24px clamp(17px,3vw,38px) 25px;display:flex;flex-direction:column;background:#1b1d24}
.notes-editor-head{padding-bottom:15px;border-bottom:1px solid var(--line);margin-bottom:18px}
.notes-save-status{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);white-space:nowrap}
.notes-save-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.notes-title-input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:clamp(23px,3vw,31px);font-weight:800;letter-spacing:-.9px;padding:10px 0 7px;margin:0 0 8px}
.notes-title-input::placeholder{color:#626978}
.notes-meta-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:10px;margin:0 0 17px}
.notes-meta-row select{background:#171920;border:1px solid var(--line);border-radius:8px;color:var(--soft);padding:6px 9px;font-size:10px;max-width:220px}
.notes-body-input{width:100%;flex:1;min-height:480px;resize:vertical;border:0;outline:0;background:transparent;color:#d7d9e0;font:400 14px/1.9 Inter,system-ui,sans-serif;padding:7px 0 24px;white-space:pre-wrap;overflow-wrap:anywhere}
.notes-body-input::placeholder{color:#747b88}
.notes-title-input[readonly],.notes-body-input[readonly]{opacity:.72;cursor:default}.notes-meta-row select:disabled{opacity:.55;cursor:not-allowed}
.notes-editor-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;color:#737b89;font-size:9px}
.notes-editor-empty{margin:auto;text-align:center;max-width:330px;padding:35px 15px;color:var(--muted)}
.notes-editor-empty .empty-icon{font-size:42px;margin-bottom:12px;color:#8271b7}
.notes-editor-empty strong{display:block;color:var(--soft);font-size:14px;margin-bottom:7px}
.notes-folder-modal-hint{font-size:10px;color:var(--muted);line-height:1.5;margin-top:8px}
@media(max-width:1050px){.notes-workspace{grid-template-columns:185px minmax(220px,250px) minmax(0,1fr)}.notes-editor{padding:20px 19px}}
@media(max-width:850px){.notes-workspace{grid-template-columns:1fr;min-height:0}.notes-rail{border-right:0;border-bottom:1px solid var(--line);padding:14px}.notes-folder-list{display:flex;flex-wrap:wrap}.notes-folder-item{width:auto;max-width:100%;padding:8px 10px}.notes-rail-label{margin:13px 6px 7px}.notes-rail-footer{display:flex;flex-wrap:wrap;margin-top:12px;padding-top:11px}.notes-middle{border-right:0;border-bottom:1px solid var(--line)}.notes-list{max-height:220px}.notes-editor{min-height:500px;padding:18px 18px 20px}.notes-body-input{min-height:360px}}
@media(max-width:470px){.notes-head-actions{width:100%}.notes-head-actions .btn{flex:1;font-size:10px;padding:9px 8px}.notes-editor-head{align-items:flex-start}.notes-title-input{font-size:25px}.notes-body-input{font-size:14px}}


/* Notes notebook controls */
.folder-controls{display:flex;align-items:center;gap:2px;flex-shrink:0}
.notes-folder-item .folder-edit,.notes-folder-item .folder-delete{opacity:.72;border:0;background:transparent;color:inherit;padding:3px 5px;border-radius:6px;cursor:pointer;font-size:11px;line-height:1}
.notes-folder-item .folder-edit:hover{opacity:1;background:#ffffff12}
.notes-folder-item .folder-delete{color:#d58b91;font-size:15px;font-weight:700}
.notes-folder-item .folder-delete:hover{opacity:1;background:#d58b911f}
.notes-folder-item.active .folder-delete{color:#f0a5aa}

<script>
(()=>{'use strict';
const KEY='personal-os-v1';
const STUDY_FREQUENCIES=['Diário','Dias úteis','Semanal','Quinzenal','Mensal','Anual'];
const $=(s,r=document)=>r.querySelector(s);const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateFmt=(s)=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'—';
const money=(n)=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const monthKey=()=>today().slice(0,7);
const dayOffset=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const emptyState=()=>({habits:[],habitLogs:[],habitArchives:[],transactions:[],subjects:[],studySessions:[],studyPlans:[],studyArchives:[],goals:[],customSubjectCategories:[],folders:[{id:'root-learning',name:'Aprendizados',parentId:null},{id:'root-books',name:'Livros',parentId:null},{id:'root-ideas',name:'Ideias e projetos',parentId:null}],notes:[],pomodoro:{focusCount:0,longBreaksCompleted:0,cycleProgress:0,totalFocusSeconds:0,history:[],settings:{focusMinutes:50,shortBreakMinutes:5,longBreakMinutes:30,cyclesBeforeLongBreak:4,subjectId:'',subjectNameSnapshot:'',subjectCategorySnapshot:'',planId:'',task:''}},monthlyClosings:[],customTransactionCategories:{expense:[],income:[]},customHabitCategories:[],meta:{lastSeenMonth:null}});
function normalizeHabitLogs(logs){
  const byDay=new Map();
  (Array.isArray(logs)?logs:[]).forEach((raw,index)=>{
    if(!raw||raw.habitId===undefined||raw.habitId===null)return;
    const date=String(raw.date||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
    const habitId=String(raw.habitId);const key=`${habitId}|${date}`;
    const log={...raw,habitId,date,done:!!raw.done};
    const stamp=String(raw.updatedAt||raw.createdAt||'');
    const previous=byDay.get(key);
    // The latest user action wins; when timestamps are absent/equal, preserve array order.
    if(!previous||stamp>=previous.stamp)byDay.set(key,{log,stamp,index});
  });
  return [...byDay.values()].sort((a,b)=>a.index-b.index).map(x=>x.log);
}
function normalizeState(raw){const base=emptyState();if(!raw||typeof raw!=='object')return base;const merged={...base,...raw};for(const key of ['habits','habitLogs','habitArchives','transactions','subjects','studySessions','studyPlans','studyArchives','goals','folders','notes','monthlyClosings'])merged[key]=Array.isArray(raw[key])?raw[key]:base[key];merged.habitLogs=normalizeHabitLogs(merged.habitLogs);merged.habitArchives=Array.isArray(raw.habitArchives)?raw.habitArchives:[];merged.studyArchives=Array.isArray(raw.studyArchives)?raw.studyArchives:[];merged.folders=merged.folders.map(f=>({...f,parentId:null}));merged.subjects=merged.subjects.map(subject=>({...subject,plannedMinutes:Number(subject.plannedMinutes)>0?Math.round(Number(subject.plannedMinutes)):180,frequency:STUDY_FREQUENCIES.includes(subject.frequency)?subject.frequency:'Semanal',frequencyStart:/^\d{4}-\d{2}-\d{2}$/.test(subject.frequencyStart||'')?subject.frequencyStart:(/^\d{4}-\d{2}-\d{2}$/.test(subject.createdAt||'')?subject.createdAt:today())}));merged.studyPlans=merged.studyPlans.map(plan=>({...plan,id:String(plan.id||uid()),date:/^\d{4}-\d{2}-\d{2}$/.test(String(plan.date||''))?String(plan.date):today(),subjectId:String(plan.subjectId||''),subjectNameSnapshot:String(plan.subjectNameSnapshot||''),subjectCategorySnapshot:String(plan.subjectCategorySnapshot||''),task:String(plan.task||''),plannedMinutes:Math.max(1,Math.round(Number(plan.plannedMinutes)||50))}));const folderIds=new Set(merged.folders.map(f=>String(f.id)));merged.notes=merged.notes.map(n=>({...n,folderId:folderIds.has(String(n.folderId))?String(n.folderId):null,trashedAt:n.trashedAt||null}));merged.habits=merged.habits.map(h=>({...h,createdAt:h.createdAt||(merged.habitLogs.filter(l=>String(l.habitId)===String(h.id)&&l.date).map(l=>l.date).sort()[0]||today())}));merged.customTransactionCategories={expense:Array.isArray(raw.customTransactionCategories?.expense)?raw.customTransactionCategories.expense:[],income:Array.isArray(raw.customTransactionCategories?.income)?raw.customTransactionCategories.income:[]};merged.customHabitCategories=Array.isArray(raw.customHabitCategories)?raw.customHabitCategories:[];merged.customSubjectCategories=Array.isArray(raw.customSubjectCategories)?raw.customSubjectCategories:[];merged.goals=merged.goals.map(g=>({...g,horizon:['Curto prazo','Médio prazo','Longo prazo'].includes(g.horizon)?g.horizon:'Curto prazo',completed:!!g.completed}));merged.pomodoro={...base.pomodoro,...(raw.pomodoro||{})};merged.pomodoro.settings={...base.pomodoro.settings,...(raw.pomodoro?.settings||{})};merged.pomodoro.history=Array.isArray(merged.pomodoro.history)?merged.pomodoro.history:[];const cycleLimit=Math.max(2,Number(merged.pomodoro.settings.cyclesBeforeLongBreak)||4);const storedCycle=Number(raw.pomodoro?.cycleProgress);merged.pomodoro.cycleProgress=Number.isFinite(storedCycle)?Math.max(0,Math.min(cycleLimit,Math.floor(storedCycle))):Math.max(0,Math.min(cycleLimit,(Number(merged.pomodoro.focusCount)||0)-(Number(merged.pomodoro.longBreaksCompleted)||0)*cycleLimit));merged.meta={...base.meta,...(raw.meta||{})};return merged}
let state;try{state=normalizeState(JSON.parse(localStorage.getItem(KEY)))}catch(e){state=emptyState()}
// Sessões em andamento permanecem provisórias. O Pomodoro as restaura pausadas
// na inicialização; elas só entram no histórico depois de salvas ou concluídas.

function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Não foi possível salvar neste navegador. Baixe um backup para liberar espaço ou guardar uma cópia externa.')}}
function migrateStudyDataV044(){
  let changed=false;
  if(!state.meta.studySessionSnapshotsV044){
    const byId=new Map(state.subjects.map(x=>[String(x.id),x]));
    const snapshot=list=>(Array.isArray(list)?list:[]).forEach(rec=>{if(!rec||rec.type==='break')return;const subject=byId.get(String(rec.subjectId||''));if(!rec.subjectNameSnapshot){rec.subjectNameSnapshot=subject?.name||(!rec.subjectId?'Geral':'Matéria removida');changed=true}if(!rec.subjectCategorySnapshot){rec.subjectCategorySnapshot=subject?.category||'';changed=true}});
    snapshot(state.studySessions);snapshot(state.pomodoro.history);
    state.meta.studySessionSnapshotsV044=true;changed=true;
  }
  if(!state.meta.studyPlansSeededV044){
    // The daily planner has been removed from Studies. Keep any legacy studyPlans
    // in storage for backup compatibility, but never generate new daily-plan rows.
    state.meta.studyPlansSeededV044=true;changed=true;
  }
  if(changed)persist();
}
migrateStudyDataV044();
function resetLegacyStudyTrackingV054(){
  if(state.meta.studyPomodoroResetV054)return;
  // Keep subjects and Pomodoro preferences, but start the study-time history clean.
  state.studySessions=[];
  state.studyArchives=[];
  state.pomodoro.history=[];
  state.pomodoro.totalFocusSeconds=0;
  state.pomodoro.focusCount=0;
  state.pomodoro.longBreaksCompleted=0;
  state.pomodoro.cycleProgress=0;
  state.meta.studyPomodoroResetV054=true;
  persist();
}
resetLegacyStudyTrackingV054();
function studyDailyMinutes(subjectId,date){return getStudySessions().filter(session=>String(session.subjectId||'')===String(subjectId)&&String(session.date||'')===String(date)).reduce((sum,session)=>sum+Math.max(0,Number(session.minutes)||0),0)}
function processStudyCycleArchives(date=today(),save=true){
  const remaining=[],created=[],closed=[];let changed=false;
  const sessions=getStudySessions();
  for(const subject of state.subjects){
    const bounds=studyFrequencyBounds(subject,date);
    if(!bounds){remaining.push(subject);continue}
    const frequency=STUDY_FREQUENCIES.includes(subject.frequency)?subject.frequency:'Semanal';
    if(frequency==='Diário'){remaining.push(subject);continue}
    const inCycle=sessions.filter(session=>{
      const sessionDate=String(session.date||'');
      if(String(session.subjectId||'')!==String(subject.id)||!sessionDate||sessionDate<bounds.start||sessionDate>=bounds.end||Number(session.minutes||0)<=0)return false;
      if(frequency==='Dias úteis'){
        const weekday=new Date(`${sessionDate}T12:00:00`).getDay();
        if(weekday===0||weekday===6)return false;
      }
      return true;
    });
    const actualMinutes=inCycle.reduce((sum,session)=>sum+Math.max(0,Number(session.minutes)||0),0);
    const plannedMinutes=Math.max(1,Number(subject.plannedMinutes)||180);
    const completed=actualMinutes>=plannedMinutes;
    const expired=date>=bounds.end;
    if(!completed&&!expired){remaining.push(subject);continue}
    closed.push({subjectId:String(subject.id),name:String(subject.name||''),status:completed?'completed':'expired',periodStart:bounds.start,periodEnd:bounds.end});
    if(completed){
      const duplicate=(state.studyArchives||[]).some(item=>String(item.subjectId)===String(subject.id)&&String(item.periodStart||item.date)===bounds.start);
      if(!duplicate)created.push({archiveId:uid(),subjectId:String(subject.id),name:String(subject.name||''),category:String(subject.category||''),description:String(subject.description||''),frequency:frequency,date:bounds.start,periodStart:bounds.start,periodEnd:bounds.end,archivedAt:date,status:'completed',plannedMinutes,actualMinutes,archivedAtTimestamp:new Date().toISOString()});
    }
    // Expired, unfulfilled cycles leave the active list but do not become
    // achievements. Their real session minutes remain in the permanent history.
    changed=true;
  }
  if(created.length){state.studyArchives=[...(state.studyArchives||[]),...created];changed=true}
  if(changed){state.subjects=remaining;if(save)persist()}
  return closed;
}
// Routine and study cycles are closed at the first app open after completion or expiry.
processStudyCycleArchives(today(),true);
// Save normalized defaults so legacy habits keep a stable cycle anchor across reloads.
persist();
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2400)}
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='dashboard';let selectedFolder='all';let editingNote=null;let noteQuery='';let selectedNoteId=null;let noteSaveTimer=null;let goalsFilter='active';let lastGoalsDateCheck=today();
let financeMonth=monthKey();let financeMonthManual=false;
const TRANSACTION_CATEGORIES={
  expense:['Alimentação','Transporte','Moradia','Contas','Saúde','Beleza','Educação','Lazer','Viagem','Compras','Assinaturas','Ajuda','Cartão de crédito','Outros'],
  income:['Salário','Freelance','Estágio / Bolsa','Investimentos','Reembolso','Ajuda recebida','Vendas','Outros']
};
const pageNames={dashboard:'Visão geral',habits:'Rotina',finance:'Financeiro',studies:'Estudos',notes:'Notes',goals:'Metas',timer:'Pomodoro'};
function go(p){if(page==='notes')flushNoteAutosave();page=p;$('#crumbName').textContent=pageNames[p];$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function showModal(html){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal">${html}</div></div>`;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()})}
function closeModal(){$('#modalRoot').innerHTML=''}
function pageHead(eyebrow,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-desc">${desc}</p></div>${action}</div>`}
function cardHead(title,sub='',right=''){return `<div class="card-head"><div><div class="card-title">${title}</div>${sub?`<div class="card-sub">${sub}</div>`:''}</div>${right}</div>`}
function last7(){return Array.from({length:7},(_,i)=>dayOffset(i-6))}
const HABIT_CATEGORIES=['Estudos','Idiomas','Dever de casa','Saúde','Exercícios','Deus','Organização','Leitura','Alimentação','Sono','Finanças','Trabalho','Família','Desenvolvimento pessoal','Lazer','Outros'];
const STUDY_CATEGORIES=['Programação','Faculdade','Idiomas','Leitura','Projetos','Preparação para prova','Outros'];
const HABIT_FREQUENCIES=['Uma vez','Diário','Dias úteis','Semanal','Quinzenal','Mensal','Anual'];
function addCalendarDays(dateText,days){const d=new Date(`${dateText}T12:00:00`);d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addBusinessDays(dateText,count){
  let cursor=dateText,added=0,guard=0;
  while(added<count&&guard<30){cursor=addCalendarDays(cursor,1);const day=new Date(`${cursor}T12:00:00`).getDay();if(day!==0&&day!==6)added++;guard++}
  return cursor;
}
function addCalendarMonths(dateText,months){const [year,month,day]=dateText.split('-').map(Number);const targetIndex=year*12+(month-1)+months;const targetYear=Math.floor(targetIndex/12),targetMonth=targetIndex%12+1;const lastDay=new Date(targetYear,targetMonth,0).getDate();return `${targetYear}-${String(targetMonth).padStart(2,'0')}-${String(Math.min(day,lastDay)).padStart(2,'0')}`;}
function addCalendarYears(dateText,years){const [year,month,day]=dateText.split('-').map(Number);const targetYear=year+years;const lastDay=new Date(targetYear,month,0).getDate();return `${targetYear}-${String(month).padStart(2,'0')}-${String(Math.min(day,lastDay)).padStart(2,'0')}`;}
function habitPeriodBounds(h,date=today()){
  const frequency=HABIT_FREQUENCIES.includes(h?.frequency)?h.frequency:'Diário';
  const created=/^\d{4}-\d{2}-\d{2}$/.test(h?.createdAt||'')?h.createdAt:date;
  // Monthly and annual habits use their explicit cycle anchor. The creation date
  // remains the fallback for older records that predate cycleStart.
  const cycleAnchor=['Mensal','Anual'].includes(frequency)&&/^\d{4}-\d{2}-\d{2}$/.test(h?.cycleStart||'')?h.cycleStart:created;
  if(date<cycleAnchor)return null;
  if(frequency==='Diário')return {start:date,end:addCalendarDays(date,1),denominator:1,label:'Meta de hoje',ended:false};
  if(frequency==='Uma vez')return {start:created,end:addCalendarDays(created,1),denominator:1,label:'Somente neste dia',ended:date>=addCalendarDays(created,1)};
  if(frequency==='Dias úteis'){
    const createdDay=new Date(`${created}T12:00:00`).getDay();
    const start=(createdDay===0||createdDay===6)?addCalendarDays(created,createdDay===6?2:1):created;
    const end=addBusinessDays(start,5);
    return {start,end,denominator:5,label:'5 dias úteis',ended:date>=end};
  }
  if(frequency==='Semanal'||frequency==='Quinzenal'){
    const length=frequency==='Semanal'?7:14,end=addCalendarDays(created,length);
    return {start:created,end,denominator:length,label:frequency==='Semanal'?'Ciclo de 7 dias':'Ciclo de 14 dias',ended:date>=end};
  }
  if(frequency==='Mensal'){
    const end=addCalendarMonths(cycleAnchor,1);
    const denominator=Math.max(1,Math.round((new Date(`${end}T12:00:00`)-new Date(`${cycleAnchor}T12:00:00`))/86400000));
    return {start:cycleAnchor,end,denominator,label:`Ciclo mensal · ${denominator} dias`,ended:date>=end};
  }
  const end=addCalendarYears(cycleAnchor,1);
  const denominator=Math.max(1,Math.round((new Date(`${end}T12:00:00`)-new Date(`${cycleAnchor}T12:00:00`))/86400000));
  return {start:cycleAnchor,end,denominator,label:`Ciclo anual · ${denominator} dias`,ended:date>=end};
}
function habitCycleKey(h,date=today()){
  const frequency=HABIT_FREQUENCIES.includes(h?.frequency)?h.frequency:'Diário';
  const d=new Date(`${date}T12:00:00`);if(Number.isNaN(d.getTime()))return null;

function sparkline(vals){const w=300,h=66,p=5;const max=Math.max(1,...vals)*1.15;const pts=vals.map((v,i)=>[p+i*(w-2*p)/Math.max(1,vals.length-1),h-p-(v/max)*(h-2*p)]);const path=pts.map((a,i)=>(i?'L':'M')+a[0]+','+a[1]).join(' ');return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:66px;display:block"><path d="${path}" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="#a78bfa"/>`).join('')}</svg>`}

function habitTrendChart(days){
  const values=days.map(d=>state.habitLogs.filter(x=>x.date===d&&x.done).length);
  const labels=days.map(d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'}).replace('.',''));
  const w=620,h=220,left=38,right=14,top=18,bottom=42;
  const max=Math.max(4,...values);
  const step=Math.max(1,Math.ceil(max/4));
  const yMax=Math.ceil(max/step)*step;
  const x=i=>left+i*(w-left-right)/Math.max(1,values.length-1);
  const y=v=>top+(h-top-bottom)*(1-v/yMax);
  const points=values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const grid=Array.from({length:5},(_,i)=>{
    const value=yMax-i*step, yy=y(value);
    return `<line x1="${left}" y1="${yy}" x2="${w-right}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${left-10}" y="${yy+4}" text-anchor="end" fill="var(--muted)" font-size="10">${value}</text>`;
  }).join('');
  const dots=values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#a78bfa" stroke="#191b22" stroke-width="2"><title>${labels[i]}: ${v} conclusões</title></circle>`).join('');
  const xlabels=labels.map((label,i)=>`<text x="${x(i)}" y="${h-13}" text-anchor="middle" fill="var(--muted)" font-size="10">${escapeHtml(label)}</text>`).join('');
  return `<div class="habit-line-chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de linha das conclusões dos últimos sete dias" style="width:100%;height:auto;display:block">${grid}<polyline points="${points}" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${xlabels}</svg></div>`;
}

function monthLabel(key){const [y,m]=key.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function defaultTransactionDate(month=monthKey()){const [year,monthNumber]=month.split('-').map(Number);const now=new Date();const day=month===monthKey()?now.getDate():Math.min(now.getDate(),new Date(year,monthNumber,0).getDate());return `${year}-${String(monthNumber).padStart(2,'0')}-${String(day).padStart(2,'0')}`}

function makeMonthlyClosing(month){const transactions=state.transactions.filter(t=>String(t.date||'').slice(0,7)===month).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));const income=transactions.filter(t=>t.type==='income').reduce((sum,t)=>sum+Number(t.amount||0),0);const expenses=transactions.filter(t=>t.type==='expense').reduce((sum,t)=>sum+Number(t.amount||0),0);const categoryTotals={};transactions.filter(t=>t.type==='expense').forEach(t=>{const key=t.category||'Outros';categoryTotals[key]=(categoryTotals[key]||0)+Number(t.amount||0)});const previous=state.monthlyClosings.find(x=>x.month===month);return {month,income,expenses,balance:income-expenses,status:financeStatus(income-expenses),count:transactions.length,categoryTotals,transactions:transactions.map(t=>({...t})),closedAt:previous?.closedAt||new Date().toISOString(),updatedAt:new Date().toISOString()}}
function upsertMonthlyClosing(month){if(!month||month>=monthKey())return null;const report=makeMonthlyClosing(month);const index=state.monthlyClosings.findIndex(x=>x.month===month);const created=index<0;if(created)state.monthlyClosings.push(report);else state.monthlyClosings[index]=report;state.monthlyClosings.sort((a,b)=>b.month.localeCompare(a.month));return {report,created}}
function processMonthlyClosings(){const current=monthKey();const months=new Set();const last=state.meta.lastSeenMonth;if(last&&last<current){let cursor=last;while(cursor<current){months.add(cursor);cursor=nextMonthKey(cursor)}}state.transactions.forEach(t=>{const month=String(t.date||'').slice(0,7);if(/^\d{4}-\d{2}$/.test(month)&&month<current)months.add(month)});state.monthlyClosings.forEach(x=>{if(x.month<current)months.add(x.month)});const newly=[];let changed=false;[...months].sort().forEach(month=>{const result=upsertMonthlyClosing(month);if(result){changed=true;if(result.created)newly.push(result.report)}});if(state.meta.lastSeenMonth!==current){state.meta.lastSeenMonth=current;changed=true}if(changed)persist();return newly}

function studyDateLabel(date){
  return new Date(`${date}T12:00:00`).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
function studyPlanItems(date=studyPlanDate){
  return state.studyPlans.filter(item=>item.date===date).slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
}
function sessionSubjectLabel(session){
  return String(session?.subjectNameSnapshot||session?.subjectName||subjectName(session?.subjectId)||'Geral');
}
function studyStatsDistribution(sessions){
  const groups=new Map();
  sessions.forEach(session=>{
    const id=String(session.subjectId||'');
    const label=sessionSubjectLabel(session);
    const key=id?`id:${id}|snapshot:${label.toLocaleLowerCase('pt-BR')}`:`name:${label.toLocaleLowerCase('pt-BR')}`;
    const current=groups.get(key)||{key,id,label,minutes:0,sessions:0,category:session.subjectCategorySnapshot||''};
    current.minutes+=Number(session.minutes||0);current.sessions++;
    if(!current.label||current.label==='Geral')current.label=label;
    groups.set(key,current);
  });
  return [...groups.values()].sort((a,b)=>b.minutes-a.minutes||a.label.localeCompare(b.label,'pt-BR'));
}
function studyPlanCard(item){
  const subject=state.subjects.find(s=>String(s.id)===String(item.subjectId));

  return `<article class="study-plan-item">

function studyMonthDailyChart(month,sessions){
  const [year,monthNumber]=month.split('-').map(Number);const count=new Date(year,monthNumber,0).getDate();
  const dates=Array.from({length:count},(_,i)=>`${year}-${String(monthNumber).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`);
  const values=dates.map(date=>sessions.filter(x=>x.date===date).reduce((sum,x)=>sum+Number(x.minutes||0),0));
  const labels=dates.map((date,i)=>(i===0||(i+1)%5===0||i===count-1)?String(i+1):'');
  return chartSvg(values,labels);
}

function studyFrequencyBounds(subject,date=today()){
  const frequency=STUDY_FREQUENCIES.includes(subject?.frequency)?subject.frequency:'Semanal';
  const anchor=/^\d{4}-\d{2}-\d{2}$/.test(subject?.frequencyStart||'')?subject.frequencyStart:date;
  if(date<anchor)return null;
  let start=anchor,end,total,label;
  if(frequency==='Diário'){start=date;end=addCalendarDays(date,1);total=1;label='Meta de hoje'}
  else if(frequency==='Dias úteis'){
    const day=new Date(`${start}T12:00:00`).getDay();if(day===0||day===6)start=addCalendarDays(start,day===6?2:1);
    end=addBusinessDays(start,5);total=5;label='5 dias úteis';
  }else if(frequency==='Semanal'||frequency==='Quinzenal'){
    total=frequency==='Semanal'?7:14;end=addCalendarDays(start,total);label=frequency==='Semanal'?'Ciclo semanal':'Ciclo quinzenal';
  }else if(frequency==='Mensal'){
    end=addCalendarMonths(start,1);total=Math.max(1,Math.round((new Date(`${end}T12:00:00`)-new Date(`${start}T12:00:00`))/86400000));label='Ciclo mensal';
  }else{
    end=addCalendarYears(start,1);total=Math.max(1,Math.round((new Date(`${end}T12:00:00`)-new Date(`${start}T12:00:00`))/86400000));label='Ciclo anual';
  }
  return {start,end,total,label,ended:date>=end};
}
function studyFrequencyProgress(subject,date=today()){
  const bounds=studyFrequencyBounds(subject,date);if(!bounds||date>=bounds.end)return {done:0,total:Math.max(1,Number(subject?.plannedMinutes)||180),percent:0,label:'Ciclo encerrado',actualMinutes:0};
  const sessions=getStudySessions();
  const actualMinutes=sessions.filter(session=>String(session.subjectId||'')===String(subject.id)&&Number(session.minutes||0)>0&&String(session.date||'')>=bounds.start&&String(session.date||'')<bounds.end&&(!['Dias úteis'].includes(subject.frequency)||![0,6].includes(new Date(`${session.date}T12:00:00`).getDay()))).reduce((sum,session)=>sum+Number(session.minutes||0),0);
  const target=Math.max(1,Number(subject.plannedMinutes)||180);
  return {done:Math.min(actualMinutes,target),total:target,percent:Math.min(100,Math.round(actualMinutes/target*100)),label:`Meta de ${target} min · ${bounds.label}`,actualMinutes};
}

function pomodoroSessions(){
  const byId=new Map();
  const loose=[];
  const breaks=[];
  const addFocus=(record)=>{
    if(!record||record.type==='break'||record.status==='in-progress')return;
    const date=studySessionDate(record);
    const minutes=Math.max(0,Number(record.minutes)||0);
    if(!date||minutes<=0)return;
    const normalized={...record,date,minutes,type:'focus',source:'Pomodoro'};
    const id=record.id===undefined||record.id===null?'':String(record.id);
    if(!id){loose.push(normalized);return}
    const previous=byId.get(id);
    if(!previous){byId.set(id,normalized);return}
    const merged={...previous,...normalized};
    if(!merged.subjectId)merged.subjectId=previous.subjectId||normalized.subjectId||'';
    if(!merged.task)merged.task=previous.task||normalized.task||'';
    merged.minutes=Math.max(Number(previous.minutes)||0,minutes);
    merged.elapsedSeconds=Math.max(Number(previous.elapsedSeconds)||0,Number(record.elapsedSeconds)||0);
    if(previous.status==='completed'||record.status==='completed')merged.status='completed';
    byId.set(id,merged);
  };
  (Array.isArray(state.pomodoro?.history)?state.pomodoro.history:[]).forEach(record=>{
    if(record?.type==='break'){
      const date=studySessionDate(record),minutes=Math.max(0,Number(record.minutes)||0);
      if(date&&minutes>0)breaks.push({...record,date,minutes,type:'break'});
    }else addFocus(record);
  });
  getStudySessions().filter(s=>s.source==='Pomodoro').forEach(addFocus);
  return [...byId.values(),...loose,...breaks].sort((a,b)=>a.date.localeCompare(b.date));
}

function exportPomodoroStats(){

function openPomodoroSettings(){

  showModal(`<div class="modal-head"><div class="modal-title">Configurações do Pomodoro</div><button class="modal-close" data-close>×</button></div>
    <form id="pomodoroSettingsForm" novalidate>
      <div class="form-grid">
        <div class="field"><label for="pomFocusMinutes">Duração do foco (minutos)</label><input id="pomFocusMinutes" name="focusMinutes" type="number" min="1" max="240" step="1" required value="${Number(settings.focusMinutes||50)}"></div>
        <div class="field"><label for="pomCycles">Ciclos até a pausa longa</label><input id="pomCycles" name="cyclesBeforeLongBreak" type="number" min="2" max="8" step="1" required value="${Number(settings.cyclesBeforeLongBreak||4)}"></div>
        <div class="field"><label for="pomShortBreak">Pausa curta (minutos)</label><input id="pomShortBreak" name="shortBreakMinutes" type="number" min="1" max="90" step="1" required value="${Number(settings.shortBreakMinutes||5)}"></div>
        <div class="field"><label for="pomLongBreak">Pausa longa (minutos)</label><input id="pomLongBreak" name="longBreakMinutes" type="number" min="1" max="180" step="1" required value="${Number(settings.longBreakMinutes||30)}"></div>
        <div class="field full"><label for="pomSubject">Matéria vinculada</label><select id="pomSubject" name="subjectId">${subjectOpts}</select></div>
      </div>
      <p class="card-sub" style="margin-top:12px">Trocar a matéria vinculada preserva o tempo restante do Pomodoro. Os minutos já feitos ficam na matéria anterior; ao retomar, o tempo passa a ser registrado na nova matéria. Alterar a duração do foco inicia uma nova contagem.</p>
      <div class="modal-actions"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn primary">Salvar configurações</button></div>
    </form>`);
  const form=$('#pomodoroSettingsForm');
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(form).entries());
    const selectedSubjectId=String(d.subjectId||'');
    const subjectChanged=selectedSubjectId!==String(POM.subjectId||'');
    const next={
      focusMinutes:Number(d.focusMinutes),
      shortBreakMinutes:Number(d.shortBreakMinutes),
      longBreakMinutes:Number(d.longBreakMinutes),
      cyclesBeforeLongBreak:Number(d.cyclesBeforeLongBreak),
      subjectId:selectedSubjectId,
      subjectNameSnapshot:selectedSubjectId?subjectSnapshot(selectedSubjectId).name:'',
      subjectCategorySnapshot:selectedSubjectId?subjectSnapshot(selectedSubjectId).category:'',
      planId:subjectChanged?'':String(POM.planId||''),
      task:subjectChanged?(selectedSubjectId?`Estudo: ${subjectSnapshot(selectedSubjectId).name}`:'Sessão de foco'):String(POM.task||'')
    };
    const valid=Number.isInteger(next.focusMinutes)&&next.focusMinutes>=1&&next.focusMinutes<=240
      &&Number.isInteger(next.shortBreakMinutes)&&next.shortBreakMinutes>=1&&next.shortBreakMinutes<=90
      &&Number.isInteger(next.longBreakMinutes)&&next.longBreakMinutes>=1&&next.longBreakMinutes<=180
      &&Number.isInteger(next.cyclesBeforeLongBreak)&&next.cyclesBeforeLongBreak>=2&&next.cyclesBeforeLongBreak<=8;
    if(!valid){toast('Confira as durações e a quantidade de ciclos.');return}

    const durationChanged=next.focusMinutes!==Number(POM.focusPreset||50);
    const modeBeforeSave=POM.mode;
    // If the user changes settings while focus is running, pause at this exact point.
    // Keep both the remaining Pomodoro time and the elapsed time already attributed
    // to the current subject before switching subjects.
    if(POM.mode==='focus'&&POM.running){
      const subjectElapsed=currentFocusElapsedSeconds();
      const timerElapsed=currentPomodoroElapsedSeconds();
      syncFocusProgress(false);
      POM.elapsedSeconds=subjectElapsed;
      POM.focusElapsedSeconds=timerElapsed;
      POM.remaining=Math.max(0,POM.focusPreset*60-timerElapsed);
      POM.running=false;
      clearInterval(POM.interval);POM.interval=null;
      POM.segmentStartedAt=null;POM.endAt=null;
    }

    // Changing the linked subject closes only that subject's segment. The Pomodoro
    // itself is not restarted: its overall elapsed time and remaining time survive.
    if(POM.mode==='focus'&&(subjectChanged||durationChanged)&&POM.sessionId){
      finalizeFocusSession('interrupted');
    }

    state.pomodoro.settings=next;
    POM.focusPreset=next.focusMinutes;
    POM.breakPreset=next.shortBreakMinutes;
    POM.longBreakPreset=next.longBreakMinutes;
    POM.cyclesBeforeLongBreak=next.cyclesBeforeLongBreak;
    POM.subjectId=next.subjectId;
    POM.subjectNameSnapshot=next.subjectId?next.subjectNameSnapshot:'';
    POM.subjectCategorySnapshot=next.subjectId?next.subjectCategorySnapshot:'';
    POM.planId=next.planId;
    POM.task=next.task;

    if(durationChanged){
      // A deliberate duration change starts a new Pomodoro duration; a subject
      // change alone never changes the countdown.
      POM.elapsedSeconds=0;POM.focusElapsedSeconds=0;POM.sessionId=null;POM.startedAt=null;
      POM.segmentStartedAt=null;POM.remaining=POM.focusPreset*60;POM.lastSavedFocusMinute=-1;
    }else if(subjectChanged&&modeBeforeSave==='focus'){
      // The previous subject has already been finalized. Start a fresh accounting
      // segment on the new subject when the user presses Resume.
      POM.elapsedSeconds=0;POM.sessionId=null;POM.startedAt=null;
      POM.segmentStartedAt=null;POM.lastSavedFocusMinute=-1;
      // Preserve POM.remaining and focusElapsedSeconds exactly as they were.
    }else if(modeBeforeSave!=='focus'&&durationChanged){
      POM.remaining=(POM.mode==='long'?POM.longBreakPreset:POM.mode==='break'?POM.breakPreset:POM.focusPreset)*60;
    }

    persist();closeModal();render();updatePomodoroPopout();
    toast(subjectChanged&&modeBeforeSave==='focus'&&!durationChanged
      ?`Matéria alterada. ${timerText(POM.remaining)} restantes; o próximo foco será registrado em ${next.subjectNameSnapshot||'Geral'}.`
      :'Configurações do Pomodoro salvas!');
  });
}
function renderTimer(){return POM.analyticsOpen?pomodoroAnalytics():renderPomodoroTimer()}

function currentFocusElapsedSeconds(){
  // Elapsed time attributable to the currently selected subject only.
  // POM.elapsedSeconds is the saved time for this subject; the available capacity
  // limits only the currently running segment, not the already saved subject time.
  const runningSegment=POM.running&&POM.segmentStartedAt
    ?Math.max(0,Math.floor((Date.now()-POM.segmentStartedAt)/1000)):0;
  const remainingCapacity=Math.max(0,Number(POM.focusPreset||50)*60-Number(POM.focusElapsedSeconds||0));
  return Math.max(0,Number(POM.elapsedSeconds||0)+Math.min(remainingCapacity,runningSegment));
}
function currentPomodoroElapsedSeconds(){
  // Overall elapsed time across all subjects in this single Pomodoro countdown.
  const runningSegment=POM.running&&POM.segmentStartedAt
    ?Math.floor((Date.now()-POM.segmentStartedAt)/1000):0;
  return Math.max(0,Math.min(Number(POM.focusPreset||50)*60,Number(POM.focusElapsedSeconds||0)+Math.max(0,runningSegment)));
}
function ensureFocusSession(){
  if(POM.mode!=='focus'||POM.sessionId)return;
  const stamp=new Date().toISOString();
  const rec={id:uid(),date:today(),minutes:0,elapsedSeconds:0,type:'focus',status:'in-progress',task:POM.task||'Sessão de foco',subjectId:POM.subjectId?String(POM.subjectId):'',subjectNameSnapshot:POM.subjectNameSnapshot||subjectName(POM.subjectId),subjectCategorySnapshot:POM.subjectCategorySnapshot||subjectSnapshot(POM.subjectId).category,planId:POM.planId||'',source:'Pomodoro',startedAt:stamp};
  POM.sessionId=rec.id;
  POM.startedAt=Date.now();
  POM.elapsedSeconds=0;
  POM.segmentStartedAt=POM.running?Date.now():null;
  POM.lastSavedFocusMinute=0;
  state.pomodoro.history.push({...rec});
  state.studySessions.push({...rec});
  persist();
}
function recordedAtForPomodoroSession(startedAt,fallback){
  const time=Number(startedAt);
  return Number.isFinite(time)&&time>0?new Date(time).toISOString():fallback;
}
function syncFocusProgress(finalize=false,status='in-progress'){
  if(POM.mode!=='focus'||!POM.sessionId)return false;
  const previousLevel=pomodoroLevelInfo(pomodoroStats().focusMinutes).level;
  const elapsed=currentFocusElapsedSeconds();
  const minutes=Math.floor(elapsed/60);
  if(minutes===POM.lastSavedFocusMinute&&!finalize)return false;
  const stamp=new Date().toISOString();
  const sessionId=String(POM.sessionId);
  const template={
    id:sessionId,date:today(),type:'focus',source:'Pomodoro',
    task:POM.task||'Sessão de foco',subjectId:POM.subjectId?String(POM.subjectId):'',subjectNameSnapshot:POM.subjectNameSnapshot||subjectName(POM.subjectId),subjectCategorySnapshot:POM.subjectCategorySnapshot||subjectSnapshot(POM.subjectId).category,planId:POM.planId||'',
    startedAt:POM.startedAt?new Date(POM.startedAt).toISOString():stamp,
    recordedAt:recordedAtForPomodoroSession(POM.startedAt,stamp)
  };
  const update=record=>{
    const next={...template,...(record||{}),minutes,elapsedSeconds:elapsed,status,updatedAt:stamp};
    // The active subject selected from Estudos is authoritative for this focus session.
    next.subjectId=POM.subjectId?String(POM.subjectId):String(record?.subjectId||'');
    next.subjectNameSnapshot=POM.subjectNameSnapshot||record?.subjectNameSnapshot||subjectName(next.subjectId);
    next.subjectCategorySnapshot=POM.subjectCategorySnapshot||record?.subjectCategorySnapshot||subjectSnapshot(next.subjectId).category;
    next.planId=POM.planId||record?.planId||'';
    next.source='Pomodoro';
    if(finalize&&status==='completed')next.completedAt=stamp;
    else if(finalize&&status==='saved')next.savedAt=stamp;
    else if(finalize&&status==='interrupted')next.interruptedAt=stamp;
    return next;
  };
  const upsert=(collection)=>{
    const index=collection.findIndex(x=>String(x.id)===sessionId);
    if(index>=0)collection[index]=update(collection[index]);
    else collection.push(update(template));
  };
  if(!Array.isArray(state.pomodoro.history))state.pomodoro.history=[];
  if(!Array.isArray(state.studySessions))state.studySessions=[];
  upsert(state.pomodoro.history);
  upsert(state.studySessions);
  POM.lastSavedFocusMinute=minutes;
  recalculatePomodoroFocusTotal();
  persist();
  const currentLevel=pomodoroLevelInfo(pomodoroStats().focusMinutes).level;
  if(currentLevel>previousLevel)toast(`Parabéns! Você alcançou o nível ${currentLevel} na Jornada de foco!`);
  // The subject card, today's total and Pomodoro focus analytics all derive from this same session.
  if(page==='timer'||page==='studies'||page==='dashboard')render();
  return true;
}
function finalizeFocusSession(status='interrupted'){
  if(POM.mode!=='focus'||!POM.sessionId)return 0;
  // Preserve every fully elapsed minute, even when the configured Pomodoro
  // duration was not completed. The record remains an interrupted focus session.
  const savedMinutes=Math.floor(currentFocusElapsedSeconds()/60);
  syncFocusProgress(true,status);
  POM.sessionId=null;
  POM.elapsedSeconds=0;
  POM.segmentStartedAt=null;
  POM.lastSavedFocusMinute=-1;
  processStudyCycleArchives(today(),true);
  return savedMinutes;
}
function saveCurrentFocusSession(){
  if(POM.mode!=='focus'||!POM.sessionId){toast('Não há uma sessão ativa para salvar.');return}
  const elapsed=Math.max(0,currentFocusElapsedSeconds());
  const minutes=Math.floor(elapsed/60);
  if(minutes<1){toast('Estude por pelo menos 1 minuto completo antes de salvar a sessão.');return}
  POM.running=false;clearInterval(POM.interval);POM.interval=null;
  POM.elapsedSeconds=elapsed;POM.segmentStartedAt=null;POM.endAt=null;
  finalizeFocusSession('saved');
  POM.elapsedSeconds=0;POM.focusElapsedSeconds=0;POM.startedAt=null;
  POM.remaining=POM.focusPreset*60;POM.lastBeepRemaining=null;
  recalculatePomodoroFocusTotal();persist();updatePomodoroPopout();render();
  toast(`${formatStudyDuration(minutes)} salvos no histórico de estudos.`);
}
function discardCurrentFocusSession(confirmDiscard=true,showFeedback=true){
  if(POM.mode!=='focus'||!POM.sessionId){
    POM.running=false;clearInterval(POM.interval);POM.interval=null;POM.remaining=POM.focusPreset*60;
    POM.elapsedSeconds=0;POM.focusElapsedSeconds=0;POM.segmentStartedAt=null;POM.endAt=null;
    persist();updatePomodoroPopout();render();return true;
  }
  const elapsed=Math.max(0,currentFocusElapsedSeconds());
  const minutes=Math.floor(elapsed/60);

function deleteStudySession(id){
  const key=String(id||'');
  if(!key){toast('Não foi possível identificar essa sessão.');return}
  if(String(POM.sessionId||'')===key){toast('Pause e encerre o Pomodoro atual antes de excluir essa sessão.');return}
  const session=getStudySessions().find(x=>String(x.id)===key);
  if(!session){toast('Essa sessão não foi encontrada.');return}
  const duration=Number(session.minutes)||0;
  const activity=session.task||'Sessão de estudo';
  if(!confirm(`Excluir “${activity}” (${duration} min)? Ela será removida também das estatísticas e do progresso da matéria.`))return;
  state.studySessions=state.studySessions.filter(x=>String(x.id)!==key);
  state.pomodoro.history=(Array.isArray(state.pomodoro.history)?state.pomodoro.history:[])
    .filter(x=>x.type==='break'||String(x.id)!==key);
  recalculatePomodoroFocusTotal();
  // If a daily subject had been archived as completed, recalculate its result
  // after a historical session is removed so the completion badge stays truthful.
  (state.studyArchives||[]).forEach(item=>{
    const start=String(item.periodStart||item.date||'');
    const end=String(item.periodEnd||addCalendarDays(start,1));
    if(String(item.subjectId)!==String(session.subjectId||'')||String(session.date||'')<start||String(session.date||'')>=end)return;
    const actualMinutes=getStudySessions().filter(x=>String(x.subjectId||'')===String(item.subjectId)&&String(x.date||'')>=start&&String(x.date||'')<end).reduce((sum,x)=>sum+Number(x.minutes||0),0);
    item.actualMinutes=actualMinutes;
    item.status=actualMinutes>=Number(item.plannedMinutes||0)?'completed':'expired';
  });
  persist();
  render();
  toast('Sessão excluída do histórico e das estatísticas.');
}

function undoLastStudySession(){
  const latest=[...(Array.isArray(state.studySessions)?state.studySessions:[])]
    .reverse().find(x=>x&&x.status!=='in-progress'&&Number(x.minutes)>0&&String(x.id||''));
  const fallback=getStudySessions().find(x=>String(x.id||''));
  const target=latest||fallback;
  if(!target){toast('Não há registros para desfazer.');return}
  deleteStudySession(target.id);
}

ress.done,totalDays:progress.total,logs:logs.map(log=>({...log})),archivedAtTimestamp:new Date().toISOString()}]}state.habits=state.habits.filter(h=>String(h.id)!==String(id));persist();render();toast('Atividade removida. As marcações foram preservadas no relatório mensal.')}}if(a==='delete-transaction'){if(confirm('Excluir esta movimentação? Essa ação não poderá ser desfeita.')){const removed=state.transactions.find(t=>t.id===id);state.transactions=state.transactions.filter(t=>t.id!==id);if(removed)refreshMonthlyClosing([String(removed.date||'').slice(0,7)]);persist();render();toast('Movimentação excluída e fechamento atualizado')}}if(a==='download-monthly-backup')downloadMonthlyBackup(el.dataset.month);if(a==='download-finance-excel')downloadMonthlyBackup(financeMonth);if(a==='delete-subject'){deleteStudySubject(id);return}if(a==='delete-note'){flushNoteAutosave();const note=state.notes.find(n=>String(n.id)===String(id));if(note&&!note.trashedAt){note.trashedAt=new Date().toISOString();selectedFolder='trash';selectedNoteId=note.id;noteQuery='';persist();render();toast('Página movida para a Lixeira.')}}if(a==='restore-note'){const note=state.notes.find(n=>String(n.id)===String(id));if(note&&note.trashedAt){note.trashedAt=null;selectedFolder=note.folderId&&state.folders.some(f=>String(f.id)===String(note.folderId))?String(note.folderId):'all';selectedNoteId=note.id;noteQuery='';persist();render();toast('Página restaurada.')}}if(a==='delete-note-permanently'){if(confirm('Excluir esta página definitivamente? Não será possível recuperá-la.')){state.notes=state.notes.filter(n=>String(n.id)!==String(id));selectedNoteId=null;selectedFolder='trash';persist();render();toast('Página excluída definitivamente.')}}if(a==='toggle-habit'){const habit=state.habits.find(h=>String(h.id)===String(id));if(!habit){toast('Atividade não encontrada.');return}if(toggleHabitDate(habit,today()))render()}if(a==='backup')backup();if(a==='restore')$('#restoreInput').click()}

document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form).entries());if(form.id==='habitForm'){
  const id=String(data.id||'').trim();
  const name=String(data.name||'').trim();
  const category=String(data.category||'').trim();
  const frequency=String(data.frequency||'Diário').trim();
  if(!name||!category||!HABIT_FREQUENCIES.includes(frequency)){toast('Preencha o nome, a categoria e a frequência da atividade.');return}
  const index=id?state.habits.findIndex(h=>String(h.id)===id):-1;
  if(id&&index<0){toast('Essa atividade não foi encontrada. Atualize a página e tente novamente.');return}
  const previous=index>=0?state.habits[index]:null;
  const habit={...(previous||{}),id:id||uid(),name,category,frequency,createdAt:previous?(previous.frequency===frequency?(previous.createdAt||today()):today()):today(),updatedAt:today()};
  if(index>=0)state.habits[index]=habit;else state.habits.push(habit);
  persist();closeModal();render();toast(id?'Atividade atualizada':'Atividade criada');
}if(form.id==='transactionForm'){
  const type=data.type==='income'?'income':'expense';
  const amount=Number(String(data.amount||'').replace(',','.'));
  const date=String(data.date||'').trim();
  const description=String(data.description||'').trim();
  const category=String(data.category||'').trim();
  const id=String(data.id||'').trim();
  if(!Number.isFinite(amount)||amount<=0||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)||!description||!category){toast('Confira descrição, valor, categoria e data antes de salvar.');return}
  const previous=id?state.transactions.find(t=>String(t.id)===id):null;
  if(id&&!previous){toast('Não encontrei essa movimentação para editar. Atualize a página e tente novamente.');return}
  const item={...(previous||{}),id:id||uid(),type,amount,description,category,date};
  if(previous){const index=state.transactions.findIndex(t=>String(t.id)===id);state.transactions[index]=item}else{state.transactions.push(item)}
  const affected=[previous?.date?String(previous.date).slice(0,7):null,date.slice(0,7)];
  refreshMonthlyClosing(affected);
  financeMonth=date.slice(0,7);financeMonthManual=financeMonth!==monthKey();
  try{localStorage.setItem(KEY,JSON.stringify(state));const saved=JSON.parse(localStorage.getItem(KEY)||'{}');const confirmed=Array.isArray(saved.transactions)&&saved.transactions.find(t=>String(t.id)===String(item.id));if(!confirmed||confirmed.category!==category){toast('A alteração não foi confirmada pelo navegador. Tente novamente e faça um backup dos dados.');return}}catch(err){toast('Não foi possível confirmar o salvamento neste navegador. Faça um backup antes de continuar.');return}
  closeModal();if(page!=='finance')go('finance');else render();toast(id?'Movimentação atualizada':'Movimentação salva')
}if(form.id==='studyForm'){const snap=subjectSnapshot(data.subjectId);const stamp=new Date().toISOString();const rec={id:uid(),subjectId:data.subjectId,subjectNameSnapshot:data.subjectId?snap.name:'Geral',subjectCategorySnapshot:snap.category,task:data.task.trim(),minutes:Number(data.minutes),date:data.date,source:'Manual',createdAt:stamp,recordedAt:stamp,status:'saved'};state.studySessions.push(rec);processStudyCycleArchives(today(),false);persist();closeModal();render();toast('Sessão registrada')}if(form.id==='folderForm'){const id=String(data.id||'').trim();const name=String(data.name||'').trim();if(!name){toast('Digite um nome para o caderno.');return}if(id){const folder=state.folders.find(f=>String(f.id)===id);if(folder){folder.name=name;persist();closeModal();render();toast('Caderno renomeado')}}else{const folder={id:uid(),name,parentId:data.parentId||null};state.folders.push(folder);selectedFolder=folder.id;selectedNoteId=null;persist();closeModal();render();toast('Caderno criado')}}});
